<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIオンライン中国語予習プラットフォーム | 《時代華語》</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@500;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #0d9488;
            --accent-light: #ccfbf1;
            --bg-page: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-page);
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* 頂部設計感橫幅 */
        .hero {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 55%, #0d9488 100%);
            color: #ffffff;
            padding: 56px 20px 68px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.2);
        }

        .hero::before {
            content: "";
            position: absolute;
            top: -50%;
            right: -10%;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .badge-top {
            display: inline-block;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 5px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.05em;
            margin-bottom: 16px;
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(24px, 4vw, 34px);
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .hero p {
            margin: 12px auto 0;
            max-width: 600px;
            font-size: 15px;
            color: #cbd5e1;
        }

        /* 主容器 */
        .container {
            max-width: 1140px;
            margin: -32px auto 60px;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }

        /* 快速篩選按鈕列 */
        .filter-bar {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            padding: 12px 18px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 28px;
            border: 1px solid #ffffff;
        }

        .filter-btn {
            border: 1px solid var(--border-color);
            background: #ffffff;
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .filter-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(30, 58, 138, 0.25);
        }

        /* 24堂課網格 */
        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 22px;
        }

        /* 單張課程卡片 */
        .lesson-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            text-decoration: none;
            color: inherit;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .lesson-card::top {
            content: "";
        }

        .lesson-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent);
            box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(13, 148, 136, 0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .lesson-badge {
            background: #eff6ff;
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            padding: 4px 12px;
            border-radius: 8px;
        }

        .lesson-card:hover .lesson-badge {
            background: var(--accent-light);
            color: #0f766e;
        }

        .lesson-num-bg {
            font-size: 28px;
            font-weight: 700;
            color: #f1f5f9;
            line-height: 1;
            user-select: none;
            transition: color 0.28s ease;
        }

        .lesson-card:hover .lesson-num-bg {
            color: #e2e8f0;
        }

        .lesson-title {
            font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif;
            font-size: 19px;
            font-weight: 700;
            color: var(--text-main);
            margin: 0 0 8px 0;
        }

        .lesson-desc {
            font-size: 13.5px;
            color: var(--text-muted);
            margin: 0 0 20px 0;
            line-height: 1.55;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 14px;
            border-top: 1px dashed var(--border-color);
            font-size: 13.5px;
            font-weight: 700;
            color: var(--primary);
            transition: color 0.2s ease;
        }

        .lesson-card:hover .card-footer {
            color: var(--accent);
        }

        .arrow-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
        }

        .lesson-card:hover .arrow-circle {
            background: var(--accent);
            color: #ffffff;
            transform: translateX(4px);
        }

        footer {
            text-align: center;
            padding: 24px;
            color: var(--text-muted);
            font-size: 13px;
        }
    </style>
</head>

    <main class="container">

        <div class="filter-bar">

    </main>

    <footer>
