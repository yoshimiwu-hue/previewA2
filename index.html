<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIオンライン中国語予習プラットフォーム | 《時代華語》</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@500;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #0d9488;
            --accent-light: #ccfbf1;
            --bg-page: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-page);
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* 九宮格自動裁切定位系統（對應 stickers.png） */
        .sprite {
            background-image: url('stickers.png');
            background-size: 300% 300%;
            background-repeat: no-repeat;
            background-color: #ffffff;
            display: inline-block;
        }
        /* 第 1 排：抱書女孩、背包男孩、揮手女孩 */
        .pos-0 { background-position: 0% 0%; }
        .pos-1 { background-position: 50% 0%; }
        .pos-2 { background-position: 100% 0%; }
        /* 第 2 排：竹子熊貓、讀書熊貓、地球儀熊貓 */
        .pos-3 { background-position: 0% 50%; }
        .pos-4 { background-position: 50% 50%; }
        .pos-5 { background-position: 100% 50%; }
        /* 第 3 排：書本盆栽、珍珠奶茶、AI筆電耳機 */
        .pos-6 { background-position: 0% 100%; }
        .pos-7 { background-position: 50% 100%; }
        .pos-8 { background-position: 100% 100%; }

        /* 頂部設計感橫幅 */
        .hero {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 55%, #0d9488 100%);
            color: #ffffff;
            padding: 52px 20px 76px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.2);
        }

        .hero::before {
            content: "";
            position: absolute;
            top: -40%;
            right: -5%;
            width: 460px;
            height: 460px;
            background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .hero-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 32px;
        }

        .hero-text {
            flex: 1;
            text-align: left;
        }

        .badge-top {
            display: inline-block;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 5px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.05em;
            margin-bottom: 16px;
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(24px, 3.6vw, 34px);
            font-weight: 700;
            letter-spacing: 0.02em;
            line-height: 1.3;
        }

        .hero p {
            margin: 14px 0 0;
            max-width: 540px;
            font-size: 15px;
            color: #cbd5e1;
        }

        /* 右側主視覺角色組合區 */
        .hero-visual {
            position: relative;
            flex-shrink: 0;
            width: 280px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 中央主角色：讀書熊貓 */
        .hero-main-avatar {
            width: 175px;
            height: 175px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 18px 35px rgba(0, 0, 0, 0.28);
            z-index: 2;
        }

        /* 衛星小頭像：抱書女孩與揮手女孩 */
        .hero-sub-avatar {
            position: absolute;
            width: 74px;
            height: 74px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.22);
            z-index: 3;
        }

        .sub-left {
            top: 8px;
            left: 6px;
        }

        .sub-right {
            bottom: 8px;
            right: 6px;
        }

        .floating-pill {
            position: absolute;
            background: #ffffff;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 999px;
            box-shadow: 0 8px 16px rgba(15, 23, 42, 0.18);
            white-space: nowrap;
            z-index: 4;
        }

        .pill-top-right {
            top: 12px;
            right: -6px;
            color: #0f766e;
        }

        .pill-bottom-left {
            bottom: 12px;
            left: -8px;
            color: #1e3a8a;
        }

        @media (max-width: 768px) {
            .hero-inner {
                flex-direction: column;
                text-align: center;
            }
            .hero-text {
                text-align: center;
            }
            .hero p {
                margin: 12px auto 0;
            }
        }

        /* 主容器 */
        .container {
            max-width: 1140px;
            margin: -34px auto 60px;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }

        /* 快速篩選按鈕列 */
        .filter-bar {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(10px);
            padding: 12px 18px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 28px;
            border: 1px solid #ffffff;
        }

        .filter-btn {
            border: 1px solid var(--border-color);
            background: #ffffff;
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .filter-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(30, 58, 138, 0.25);
        }

        /* 24堂課網格 */
        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 22px;
        }

        /* 單張課程卡片 */
        .lesson-card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 22px 24px;
            text-decoration: none;
            color: inherit;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .lesson-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent);
            box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(13, 148, 136, 0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .lesson-badge {
            background: #eff6ff;
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            padding: 5px 12px;
            border-radius: 8px;
        }

        .lesson-card:hover .lesson-badge {
            background: var(--accent-light);
            color: #0f766e;
        }

        /* 卡片右上角專屬九宮格小插畫 */
        .card-sticker {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
            transition: transform 0.28s ease;
            flex-shrink: 0;
        }

        .lesson-card:hover .card-sticker {
            transform: scale(1.1) rotate(3deg);
            border-color: var(--accent);
        }

        .lesson-title {
            font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif;
            font-size: 19px;
            font-weight: 700;
            color: var(--text-main);
            margin: 0 0 8px 0;
        }

        .lesson-desc {
            font-size: 13.5px;
            color: var(--text-muted);
            margin: 0 0 18px 0;
            line-height: 1.55;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 14px;
            border-top: 1px dashed var(--border-color);
            font-size: 13.5px;
            font-weight: 700;
            color: var(--primary);
            transition: color 0.2s ease;
        }

        .lesson-card:hover .card-footer {
            color: var(--accent);
        }

        .arrow-circle {
            width: 28px;
            height: 28px;
